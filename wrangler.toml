name = "aakhya"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

routes = [
  { pattern = "aakhyaofficial.com/*", zone_name = "aakhyaofficial.com" },
  { pattern = "www.aakhyaofficial.com/*", zone_name = "aakhyaofficial.com" }
]

[vars]
NEXT_PUBLIC_PAYU_KEY = "oPPqMI"
NEXT_PUBLIC_PAYU_BASE_URL = "https://secure.payu.in/_payment"
SHOPIFY_STORE_DOMAIN = "aakhyalabel.myshopify.com"
NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN = "aakhyalabel.myshopify.com"
NEXT_PUBLIC_USE_MOCK_SHOPIFY = "false"